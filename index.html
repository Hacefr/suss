<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Vs. Impostor Web Runner (Security DLC)</title>
    
    <!-- Pixi.js v7.3.2 WebGL Runtime -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    
    <!-- JSZip v3.10.1 Client-side In-Memory Decompressor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Drag & Drop Archive Ingestion Layer -->
    <div id="drop-overlay">
        <div class="drop-card">
            <h1>VS. IMPOSTOR WEB RUNNER</h1>
            <p class="subtitle">Drop your Security DLC <code>.zip</code> or <code>.imp</code> file below</p>
            
            <div id="staged-files-list">
                <p class="no-files-text">No files loaded. Drag and drop your mod archive here!</p>
            </div>
            
            <div id="status-box" class="hidden">Waiting for mod archive...</div>
            
            <button id="start-engine-btn" class="glow-btn hidden">
                LOAD MODS & START (0 Ready)
            </button>
        </div>
    </div>

    <!-- Freeplay Song Selector Screen -->
    <div id="freeplay-screen" class="hidden">
        <header>
            <div class="title-group">
                <h2>FREEPLAY</h2>
                <span class="version-tag">SECURITY DLC v1.0.2</span>
            </div>
            <div class="header-actions">
                <span id="mod-counter">0 Songs Ready</span>
            </div>
        </header>
        <div id="song-grid"></div>
    </div>

    <!-- Active WebGL PlayState Container -->
    <div id="game-container" class="hidden">
        <!-- Hardware-Accelerated Video Cutscene Overlay -->
        <video id="video-cutscene" playsinline></video>
    </div>

    <!-- Modular Engine Scripts -->
    <script src="core.js"></script>
    <script src="characters.js"></script>
    <script src="game.js"></script>
</body>
</html>
